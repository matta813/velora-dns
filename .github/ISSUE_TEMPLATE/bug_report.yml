name: Bug report
description: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include version, deployment, sanitized config, and exact steps. Do not include secrets or private query data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
